name: pipeline-de-testes

# Acionamento manual (Actions > pipeline-de-testes > Run workflow).
# Os gatilhos de push e pull request continuam ativos como rede de seguranca.
on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [main]

jobs:
  regressao-completa:
    name: regressao completa (unitario, API e E2E)
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nivel 1. Nao usa rede: roda antes de qualquer servidor subir, porque e o
      # gate mais barato e falhar aqui economiza o resto.
      - name: 1. Testes Unitarios
        run: |
          mkdir -p evidencias
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=evidencias/unidade.xml \
            "tests/unidade/**/*.test.js"

      # Contra o back-end real, troque esta linha pelo comando que sobe o Flask.
      # O duplo de referencia da ao pipeline um alvo; verde contra ele nao e
      # evidencia sobre o produto.
      - name: Sobe o alvo (duplo de referencia)
        run: node sut-referencia/server.js &

      # Espera por condicao, nunca por tempo fixo.
      - name: Aguarda o alvo responder
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null "$BASE_URL/api/demandas"; then
              echo "alvo respondeu apos $i tentativa(s)"; exit 0
            fi
            sleep 0.5
          done
          echo "o alvo nao respondeu em 30s"; exit 1

      # Nivel 2. Cada caso verifica uma regra isolada, por historia de usuario.
      - name: 2. Testes de API
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=evidencias/api.xml \
            "tests/api/**/*.test.js"

      # Nivel 3. Jornadas ponta a ponta. Sao poucas e rapidas, entao rodam todas
      # (sem filtro por tag smoke).
      - name: 3. Testes End-to-End (E2E)
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=evidencias/e2e.xml \
            "tests/e2e/**/*.test.js"

      # Publica cada teste reprovado como anotacao (nome e motivo), legivel na
      # pagina da execucao e pela API publica de check-runs.
      - name: Anota os testes reprovados
        if: always()
        run: node scripts/anotar-falhas.js

      # if: always() e o detalhe importante: sem ele os artefatos so sao
      # publicados quando tudo passa, exatamente quando menos precisamos deles.
      - name: Publica evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-execucao
          path: evidencias/
