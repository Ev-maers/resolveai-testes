name: pipeline-de-testes

# Todos os estagios rodam contra o back-end REAL do Projeto Integrador
# (ndrfelipe/smart-city), subido dentro da propria esteira, com banco novo a
# cada execucao (.github/actions/backend-real). O duplo de referencia
# (sut-referencia/) nao e alvo de entrega: ele so serve para a verificacao de
# sensibilidade da suite (workflow sensibilidade).
#
# Cada estagio roda pelo scripts/executar-suite.js, que aplica o quality gate:
#   - falha nova (fora de data/defeitos-conhecidos.js) reprova o estagio;
#   - defeito conhecido do produto, ja triado e com prazo, nao trava o merge,
#     mas continua reprovado no relatorio, na anotacao e na issue;
#   - defeito conhecido que passou a passar reprova, ate sair do registro.
# Nao ha continue-on-error nem reexecucao automatica (docs/tas.md, secao 9).
#
# O cron usa UTC: 15:15 UTC corresponde a 12:15 em Brasilia. O GitHub executa
# o agendamento quando ha capacidade, o que pode atrasar algumas horas.
on:
  push:
    branches-ignore: [metricas] # a branch de dados nao tem testes
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      ref_backend:
        description: Branch ou commit do back-end (ndrfelipe/smart-city); vazio usa a branch padrao
        default: ''

permissions:
  contents: read
  issues: write

env:
  BASE_URL: http://localhost:5000
  ALVO_DOS_TESTES: back-end real

jobs:
  unit-api:
    name: quality-gate / unit-and-api
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifica a TAS (cobertura do plano e politica de manutencao)
        run: |
          node scripts/verificar-cobertura.js
          node scripts/verificar-politica.js

      # Nao dependem de rede: falhar aqui economiza o resto do estagio.
      - name: Testes unitarios
        run: node scripts/executar-suite.js --nivel unidade --junit evidencias/unidade.xml "tests/unidade/**/*.test.js"

      - name: Sobe o back-end real
        uses: ./.github/actions/backend-real

      - name: Testes de API (contra o back-end real)
        if: ${{ !cancelled() }}
        run: node scripts/executar-suite.js --nivel api --junit evidencias/api.xml "tests/api/**/*.test.js"

      - name: Calcula as metricas
        if: always()
        run: node scripts/metricas.js evidencias/unidade.xml evidencias/api.xml

      - name: Registra as falhas como issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SINCRONIZAR_DEFEITOS: '1'
        run: node scripts/abrir-issues.js

      - name: Gera os relatorios tecnico e de negocio
        if: always()
        run: |
          node scripts/relatorios.js
          cat evidencias/resumo.md >> "$GITHUB_STEP_SUMMARY"

      - name: Anota os testes reprovados
        if: always()
        run: node scripts/anotar-falhas.js evidencias/unidade.xml evidencias/api.xml

      - name: Publica as evidencias (JUnit, logs, metricas e relatorios)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-unit-api-${{ github.run_id }}
          path: evidencias/

  smoke-e2e:
    name: quality-gate / smoke-e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sobe o back-end real
        uses: ./.github/actions/backend-real

      - name: Testes E2E smoke contra o back-end real (3 jornadas representativas)
        run: >
          node scripts/executar-suite.js --nivel e2e --junit evidencias/e2e-smoke.xml
          tests/e2e/e2e01-ciclo-de-vida-da-demanda.test.js
          tests/e2e/e2e02-triagem-e-rejeicao.test.js
          tests/e2e/e2e03-onboarding-do-cidadao.test.js

      - name: Calcula as metricas
        if: always()
        run: node scripts/metricas.js evidencias/e2e-smoke.xml

      - name: Registra as falhas como issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/abrir-issues.js

      - name: Gera os relatorios tecnico e de negocio
        if: always()
        run: |
          node scripts/relatorios.js
          cat evidencias/resumo.md >> "$GITHUB_STEP_SUMMARY"

      - name: Anota os testes smoke reprovados
        if: always()
        run: node scripts/anotar-falhas.js evidencias/e2e-smoke.xml

      - name: Publica as evidencias E2E smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e-smoke-${{ github.run_id }}
          path: evidencias/

  regressao-completa:
    name: regression / full-suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # contents: write so para a branch `metricas` (historico e relatorios).
    # A main e protegida e nunca recebe commit da pipeline.
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      # O historico das execucoes anteriores, para a tendencia.
      - name: Busca o historico de metricas (branch metricas)
        uses: actions/checkout@v4
        with:
          ref: metricas
          path: metricas-historico

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifica a TAS (cobertura do plano e politica de manutencao)
        run: |
          node scripts/verificar-cobertura.js
          node scripts/verificar-politica.js

      - name: Sobe o back-end real
        uses: ./.github/actions/backend-real
        with:
          ref: ${{ inputs.ref_backend }}

      # Um step por nivel, para que o resultado de cada um apareca separado na
      # pagina da execucao. Todos rodam mesmo que o anterior reprove: a regressao
      # diaria e acompanhamento, e o que interessa e o retrato completo.
      - name: 1. Testes unitarios
        if: ${{ !cancelled() }}
        run: node scripts/executar-suite.js --nivel unidade --junit evidencias/unidade.xml "tests/unidade/**/*.test.js"

      - name: 2. Testes de API
        if: ${{ !cancelled() }}
        run: node scripts/executar-suite.js --nivel api --junit evidencias/api.xml "tests/api/**/*.test.js"

      - name: 3. Testes End-to-End (E2E) pela API
        if: ${{ !cancelled() }}
        run: node scripts/executar-suite.js --nivel e2e --junit evidencias/e2e.xml "tests/e2e/**/*.test.js"

      # Nivel de componente do produto: os testes unittest do proprio back-end.
      # O pytest so produz o JUnit; quem decide e o quality gate, com o mesmo
      # registro de defeitos conhecidos dos demais niveis.
      - name: 4. Testes de componente do proprio back-end (unittest)
        if: ${{ !cancelled() }}
        working-directory: .backend-real/backend
        env:
          PYTHONPATH: .
          PUSH_NOTIFICATIONS_DISABLED: '1'
        run: |
          pip install -q pytest
          set +e
          python -m pytest -q -p no:cacheprovider \
            --junitxml="$GITHUB_WORKSPACE/evidencias/backend-componente.xml" test_*.py \
            > "$GITHUB_WORKSPACE/evidencias/backend-componente.log" 2>&1
          set -e
          tail -n 20 "$GITHUB_WORKSPACE/evidencias/backend-componente.log"
          cd "$GITHUB_WORKSPACE"
          node scripts/quality-gate.js evidencias/backend-componente.xml

      # O registro de defeitos conhecidos e conferido contra a suite inteira:
      # uma entrada que cita teste inexistente reprova aqui.
      - name: Quality gate da regressao (todos os niveis)
        if: ${{ !cancelled() }}
        run: node scripts/quality-gate.js --completo evidencias/unidade.xml evidencias/api.xml evidencias/e2e.xml evidencias/backend-componente.xml

      - name: Calcula as metricas (com tendencia)
        if: always()
        run: node scripts/metricas.js evidencias/unidade.xml evidencias/api.xml evidencias/e2e.xml --historico metricas-historico/historico.jsonl

      - name: Registra as falhas como issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SINCRONIZAR_DEFEITOS: '1'
        run: node scripts/abrir-issues.js

      - name: Gera os relatorios tecnico e de negocio
        if: always()
        run: |
          node scripts/relatorios.js
          cat evidencias/resumo.md >> "$GITHUB_STEP_SUMMARY"

      - name: Anota os testes reprovados
        if: always()
        run: node scripts/anotar-falhas.js evidencias/unidade.xml evidencias/api.xml evidencias/e2e.xml evidencias/backend-componente.xml

      - name: Publica as evidencias da regressao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-regressao-${{ github.run_id }}
          path: evidencias/

      # Guarda esta execucao no historico e publica os relatorios mais recentes
      # na branch `metricas`. Com `git pull --rebase` na segunda tentativa, duas
      # execucoes proximas nao se atropelam.
      - name: Registra o historico e publica os relatorios (branch metricas)
        if: always()
        run: |
          node scripts/registrar-historico.js --pasta metricas-historico
          cd metricas-historico
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "metricas: execucao #${{ github.run_number }} (${{ github.event_name }}, ${{ github.ref_name }})" || exit 0
          git push || (git pull --rebase && git push)
